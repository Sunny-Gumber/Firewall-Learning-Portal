name: Deploy Firewall Learning Portal to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enable Study Flow v4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          if 'study-v4.css' not in html:
              html = html.replace('</head>', '  <link rel="stylesheet" href="study-v4.css" />\n</head>')
          if 'study-v4.js' not in html:
              html = html.replace('</body>', '  <script src="study-v4.js"></script>\n</body>')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
